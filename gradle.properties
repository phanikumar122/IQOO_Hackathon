org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# NOTE: `android.enableResourceOptimizations` used to live here. It was removed
# from AGP in 8.0 and setting it on AGP 8.7 fails configuration, so it is gone.
# Keeping the model out of the APK is handled by `.gitignore` and `adb push`,
# not by a Gradle flag — see the README. A ~550 MB asset would make every
# install painfully slow, and you will reinstall a hundred times.

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
